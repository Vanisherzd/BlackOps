# Tier-1 (a Nemotron Nano 4B-class model) as a second trtllm-serve beside Tier-2, started after it. Small KV share:
# Tier-1 handles the routine turns, one incident at a time. Untested starting point.
max_seq_len: 32768
max_num_tokens: 8192
enable_chunked_prefill: true
max_batch_size: 2
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.15
cuda_graph_config:
  enable_padding: true
