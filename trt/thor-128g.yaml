# Tier-2 (Nemotron-3-Nano-30B-A3B-NVFP4) on a Jetson AGX Thor T5000, 128 GB unified memory, beside a Tier-1 server.
# Untested starting point for 10/21: start Tier-2 first; free_gpu_memory_fraction is a share of the memory free at
# startup and on Thor the CPU side (OpenShell k3s, NemoClaw, RAG, the dashboard) draws from the same pool.
# Record the peak (tegrastats RAM) after both servers are up and adjust.
max_seq_len: 32768
max_num_tokens: 8192
enable_chunked_prefill: true
max_batch_size: 4
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.35
  mamba_ssm_cache_dtype: float32
cuda_graph_config:
  enable_padding: true
